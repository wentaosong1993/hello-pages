<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #fff;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: 0.05em; }
    p { margin-top: 1rem; font-size: 1.1rem; opacity: 0.85; }
    footer { position: fixed; bottom: 1rem; width: 100%; text-align: center; font-size: 0.85rem; opacity: 0.6; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World!</h1>
    <p>这是部署在 GitHub Pages 上的第一个页面。</p>
  </main>
  <footer>Powered by GitHub Pages</footer>
</body>
</html>
